services:
  mysql:
    image: mysql:8.0
    container_name: factorypulse-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: factorypulse
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: factorypulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: factorypulse-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./infrastructure/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: factorypulse-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: password123
      MYSQL_DATABASE: factorypulse
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: fp_prod_access_secret_super_secure_key_111
      JWT_REFRESH_SECRET: fp_prod_refresh_secret_super_secure_key_222
      SIMULATOR_ENABLED: "true"
      SIMULATOR_TICK_INTERVAL_MS: "3000"
    depends_on:
      - mysql
      - redis

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: factorypulse-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql-data:
